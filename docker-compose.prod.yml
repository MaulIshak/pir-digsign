# ==============================================================================
# Docker Compose Produksi + Cloudflare Tunnel (Zero Open Ports)
#
# Cara jalankan:
#   cp .env.example .env
#   # Isi APP_DOMAIN, CLOUDFLARE_TUNNEL_TOKEN, JWT_SECRET_KEY, POSTGRES_PASSWORD, dll.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
#
# Konfigurasi di Cloudflare Zero Trust -> Networks -> Tunnels -> Public Hostname:
#   Subdomain/Domain : <APP_DOMAIN> (contoh: sign.domainanda.com)
#   Service Type     : HTTP
#   URL              : gateway:80
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: digsign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digsign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      POSTGRES_DB: ${POSTGRES_DB:-digsign_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digsign} -d ${POSTGRES_DB:-digsign_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digsign-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      PUBLIC_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN wajib diisi di .env}
      API_BASE_URL: https://${APP_DOMAIN}/api
      CORS_ORIGINS: https://${APP_DOMAIN}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-digsign}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-digsign_db}
      LOCAL_STORAGE_DIR: /app/storage
      CERT_DIR: /app/certs
    volumes:
      - backend_storage:/app/storage
      - backend_certs:/app/certs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}/api
        NEXT_PUBLIC_PUBLIC_BASE_URL: https://${APP_DOMAIN}
    container_name: digsign-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}/api
      NEXT_PUBLIC_PUBLIC_BASE_URL: https://${APP_DOMAIN}
    depends_on:
      - backend
    networks:
      - internal

  gateway:
    image: nginx:1.27-alpine
    container_name: digsign-gateway
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internal

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: digsign-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN wajib diisi di .env}
    depends_on:
      - gateway
    networks:
      - internal

volumes:
  postgres_data:
  backend_storage:
  backend_certs:

networks:
  internal:
    driver: bridge
